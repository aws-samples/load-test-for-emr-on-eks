[project]
name = "emr-eks-loadtest-mcp"
version = "0.1.0"
description = "MCP server that automates the EMR on EKS load test utility"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
emr-eks-loadtest-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "helpers.py", "fmt.py"]
