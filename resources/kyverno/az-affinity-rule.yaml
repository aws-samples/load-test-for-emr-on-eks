
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: emr-job-pods-same-az
  annotations:
    policies.kyverno.io/title: EMR on EKS Spark Job AZ Balancing
    policies.kyverno.io/category: Scheduling
    policies.kyverno.io/description: >-
      Unified two-rule policy for EMR on EKS Spark workloads:
      Rule 1 (INTRA-JOB): Co-locate all pods of the same job
      (driver, executors, FGAC pods) in the same AZ as the submitters
      via podAffinity on job.id.

      Rule 2 (INTER-JOB): Spread job submitters across AZs via TSC so
      Karpenter provisions nodes in balanced zones. maxSkew=2 allows
      a pair of submitters from the same job to co-locate.

      Net effect: Jobs are evenly distributed across AZs, and all pods
      within a job share the same AZ — eliminating cross-AZ shuffle
      traffic and balancing capacity/IP usage.
spec:
  background: false
  rules:
    # ══════════════════════════════════════════════════════════════════════
    # Rule 1: INTRA-JOB — Co-locate driver, executors, FGAC pods
    #         in the same AZ as the job's submitters
    # ══════════════════════════════════════════════════════════════════════
    - name: colocate-job-pods-in-one-zone
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - emr-*
              selector:
                matchExpressions:
                  - key: emr-containers.amazonaws.com/job.id
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            affinity:
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        emr-containers.amazonaws.com/job.id: "{{ request.object.metadata.labels.\"emr-containers.amazonaws.com/job.id\" }}"
                    namespaceSelector:
                      matchExpressions:
                        - key: kubernetes.io/metadata.name
                          operator: Exists
                    topologyKey: topology.kubernetes.io/zone
    # ══════════════════════════════════════════════════════════════════════
    # Rule 2: INTER-JOB — Spread job submitters across AZs
    # ══════════════════════════════════════════════════════════════════════
    - name: spread-submitters-across-zones
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "emr*"
              selector:
                matchLabels:
                  emr-containers.amazonaws.com/component: job.submitter
                matchExpressions:
                  - key: emr-containers.amazonaws.com/job.id
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    emr-containers.amazonaws.com/component: job.submitter
                # Uncomment if your EKS cluster always has 3 AZs.
                # Forces Karpenter to consider all zones even when
                # some have 0 submitters. Requires K8s 1.30+ (GA).
                # minDomains: 3
