alertmanager:
  enabled: false       
grafana:
  # Grafana's persistence PVC below is gp3/ReadWriteOnce, so the volume can
  # attach to only one node at a time. With the chart default RollingUpdate
  # strategy a redeploy tries to start the new pod before terminating the old
  # one; if they land on different nodes the new pod wedges in Init with a
  # "Multi-Attach error" and the rollout deadlocks (old pod never releases the
  # volume). Recreate terminates the old pod first, then starts the new one --
  # no multi-attach. Single replica, so no HA is lost (brief restart downtime).
  deploymentStrategy:
    type: Recreate
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: gp3
  # Auto-load the prebuilt dashboards under grafana/dashboard-template/. The
  # sidecar watches for ConfigMaps labeled grafana_dashboard=1 and imports their
  # JSON into Grafana (surviving pod restarts, no HTTP API or admin password
  # needed). infra-provision.sh creates those ConfigMaps from the
  # datasource-normalized dashboard JSON right after this Helm install.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisorMetricRelabelings:
    - action: keep
      regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_network_receive_packets_dropped_total|container_network_transmit_packets_dropped_total|container_fs_reads_bytes_total|container_fs_writes_bytes_total
      sourceLabels: [__name__]

prometheusOperator:
  nodeSelector:
    operational: "true"
    monitor: "true"
  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 30
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 30
  admissionWebhooks:
    deployment:
      livenessProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 30
      readinessProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 30

prometheus-node-exporter:
  prometheus:
    monitor:
      metricRelabelings:
      - action: keep
        regex: node_cpu_seconds_total|node_memory_MemFree_bytes|node_memory_Cached_bytes|node_memory_Buffers_bytes|node_memory_MemTotal_bytes|node_network_transmit_bytes_total|node_network_receive_bytes_total|node_disk_read_bytes_total|node_disk_written_bytes_total|node_filesystem_free_bytes|node_filesystem_size_bytes
        sourceLabels: [__name__]

kube-state-metrics:
  metricLabelsAllowlist:
  - pods=[*]
  - nodes=[*]
  - namespaces=[*]
  collectors:
  - pods
  - nodes
  - namespaces
  prometheus:
    monitor:
      metricRelabelings:
      - action: keep
        regex: kube_pod_container_status_running|kube_pod_status_phase|kube_pod_info|kube_pod_container_resource_limits|kube_pod_container_resource_requests|kube_node_status_capacity|kube_node_status_allocatable|kube_namespace_labels|kube_node_info
        sourceLabels: [__name__]

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
    - action: drop
      regex: apiserver_request_duration_seconds_bucket;(0.15|0.25|0.3|0.35|0.4|0.45|0.6|0.7|0.8|0.9|1.25|1.5|1.75|2.5|3|3.5|4.5|6|7|8|9|15|25|30|50)
      sourceLabels: [__name__,le]
    - action: drop
      regex: apiserver_request_sli_duration_seconds_bucket
      sourceLabels: [__name__]
    - action: drop
      regex: apiserver_request_body_size_bytes_bucket
      sourceLabels: [__name__]
    - action: drop
      regex: etcd_request_duration_seconds_bucket;(0.15|0.25|0.3|0.35|0.4|0.45|0.6|0.7|0.8|0.9|1.25|1.5|1.75|2.5|3|3.5|4.5|6|7|8|9|15|25|30|50)
      sourceLabels: [__name__,le]

prometheus:
  prometheusSpec:
    additionalArgs:
      - name: storage.tsdb.min-block-duration
        value: 30m
      - name: storage.tsdb.max-block-duration
        value: 30m
      - name: log.level
        value: WARN   
    terminationGracePeriodSeconds: 90
    maximumStartupDurationSeconds: 600
    minReadySeconds: 90
    containers: 
    - name: prometheus
      startupProbe:
        failureThreshold: 30
        initialDelaySeconds: 60
      readinessProbe:
        periodSeconds: 30
        initialDelaySeconds: 60
      livenessProbe:
        periodSeconds: 30
        initialDelaySeconds: 60
      resources:
        limits:
          cpu: "15"
          memory: 100Gi
        requests:
          cpu: "4"
          memory: 15Gi
    replicas: 1
    # ensure one instance per node
    podAntiAffinity: hard
    # add an EBS volume per instance 
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Delete    # PVC is deleted when the StatefulSet is deleted
      whenScaled: Delete   
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    evaluationInterval: 30s
#         capacity: 35000
#       metadataConfig:
#         send: false
    retention: 12h
    # retentionSize: 85GB
    scrapeTimeout: 30s
    additionalScrapeConfigs:
      # Prometheus Operator doesn't scrape metrics by default from pods or endpoints with prometheus.io/scrape: "true"
      # Hence we are adding this custom scrape config for  'kubernetes-service-endpoints' and 'kubernetes-pods'
      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_service_name]
            regex: '.*node-exporter.*'
            action: drop
          - source_labels: [__meta_kubernetes_service_name]
            regex: '.*kube-dns.*'
            action: drop
          - source_labels: [__meta_kubernetes_service_name]
            regex: '.*state-metrics.*'
            action: drop
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: pod_ip
          - source_labels: [__meta_kubernetes_pod_host_ip]
            action: replace
            target_label: instance
